services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.1:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Runs the test suite, ruff and mypy against the same Postgres image CI uses.
  #   docker compose run --rm test
  #   docker compose run --rm test ruff check .
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag_test
      DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Local models: docker compose --profile ollama up, then pull the models once:
  #   docker compose exec ollama ollama pull llama3.1:8b
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
