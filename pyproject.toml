[project]
name = "rag-document-qa"
version = "0.1.0"
description = "Question answering over your own documents: FastAPI, pgvector hybrid search, a LangGraph agent and an MCP server."
readme = "README.md"
license = "MIT"
authors = [{ name = "Haresh Narola" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "langgraph>=0.2.60",
    "mcp>=1.9",
    "openai>=1.50",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "tiktoken>=0.8",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "C4", "PT"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are the idiomatic pattern

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "eval", "tests"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "tiktoken.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres with pgvector (TEST_DATABASE_URL)"]
